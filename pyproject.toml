[project]
name = "showreceipts"
version = "0.1.0"
description = "Framework-agnostic citation layer for RAG answers — inline [n] citations, renumbering, fabricated-marker removal, rule-based quality report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
docx = ["python-docx>=1.1"]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showreceipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["requires_ollama: needs a running local Ollama instance"]
