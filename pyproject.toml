[project]
name = "showreceipts"
version = "0.1.0"
description = "Framework-agnostic citation layer for RAG answers — inline [n] citations, renumbering, fabricated-marker removal, rule-based quality report"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.scripts]
showreceipts = "showreceipts.cli:main"

[project.optional-dependencies]
pdf = ["pypdf[crypto]>=4.0"]
docx = ["python-docx>=1.1"]
demo = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "ruff>=0.17.2",
    "hypothesis>=6.170.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/showreceipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not requires_ollama' --strict-markers"
markers = ["requires_ollama: needs a running local Ollama instance"]

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["*.py"]
extend-exclude = ["specs/archive"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 長字串常值由 formatter 決定換行，不強制
ignore = ["E501"]
